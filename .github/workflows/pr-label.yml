# Every pull request carries exactly one category label, because the release notes are grouped by
# them (.github/release.yml). Required on `main` by the repository's ruleset, so nothing merges
# without one. Re-runs when a label is added or removed, and the newest run is the one that counts.
name: PR label

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

# One run per pull request at a time: a newer event cancels the older run instead of racing it. Without
# this, `gh pr create --label` fired `opened` and `labeled` a second apart, and whichever finished last
# decided the check.
concurrency:
  group: pr-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  label:
    name: label
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test the check
        run: bash .github/scripts/check-pr-labels.test.sh
      - name: Check the labels
        # The labels as they are now, read from the API, not from the event: an `opened` event carries
        # the labels the pull request had at that instant, which for `gh pr create --label` is none,
        # and a re-run replays that same payload. Passed through the environment, never interpolated
        # into the script: label names are text.
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          labels=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '[.[].name]')
          bash .github/scripts/check-pr-labels.sh "$labels"
