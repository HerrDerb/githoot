# Reruns the macOS test job on main when it fails or is cancelled, at most twice.
#
# GitHub's macOS runners sometimes never pick a job up: it sits queued and is cancelled with no step
# run, which a step-level retry cannot catch. Only macOS, and only on main: a red Linux or Windows
# job, or a red PR, should stay red at once. `workflow_run` fires only from the default branch, so
# this file does nothing until merged.
name: CI retry (macOS)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: write

jobs:
  rerun-macos:
    # Attempts 1 and 2 may be rerun; attempt 3 is final.
    if: >-
      contains(fromJSON('["failure","cancelled"]'), github.event.workflow_run.conclusion)
      && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Rerun the macOS job
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # A newer push to main cancels the older run on purpose (ci.yml's concurrency group).
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" -q .sha)" != "$SHA" ]; then
            echo "main has moved on; not rerunning an old commit"
            exit 0
          fi
          job=$(gh run view "$RUN" -R "$GITHUB_REPOSITORY" --json jobs \
            -q '.jobs[] | select(.name == "test (macos-15)" and (.conclusion == "failure" or .conclusion == "cancelled")) | .databaseId')
          if [ -z "$job" ]; then
            echo "macOS passed; nothing to rerun"
            exit 0
          fi
          gh run rerun "$RUN" -R "$GITHUB_REPOSITORY" --job "$job"
