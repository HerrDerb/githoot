# How GitHub groups a release's notes, by the label on each merged pull request. Every pull request
# has exactly one category label, plus `breaking` optionally (.github/workflows/pr-label.yml).
#
# A pull request lands in the first section that matches, so Breaking changes comes first and wins.
# `internal` (CI, refactors, tests, docs, release bumps) is listed last: these notes are what people
# read on the Updates page before they install, so what matters to them comes first.
changelog:
  categories:
    - title: ⚠️ Breaking changes
      labels:
        - breaking
    - title: New features
      labels:
        - feature
    - title: Improvements
      labels:
        - improvement
    - title: Bug fixes
      labels:
        - bug
    - title: Security
      labels:
        - security
    - title: Dependencies
      labels:
        - dependencies
    - title: Internal
      labels:
        - internal
    # Only a pull request merged before labels were required can land here.
    - title: Other changes
      labels:
        - "*"
